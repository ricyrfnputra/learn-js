<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Salam</title>
  </head>
  <body>
    <!-- format waktu -->
    <div class="main">
      <input type="text" id="waktu" placeholder="Masukan waktu" />
      <button onclick="formatJam12()">Test Format</button>
    </div>
    <div id="output">
        
    </div><br>


    <script>
      function formatJam12() {
        const jam = Number(document.getElementById("waktu").value);
        if(jam < 0){
            alert("waktu tidak valid")
        } else if(jam > 24){
            alert("waktu tidak valid")
            return;
        }

        const label = jam < 12 ? "AM" : "PM";
        const jam12 = jam % 12 === 0 ? 12 : jam % 12;
        document.getElementById("output").textContent = `format waktu nya adalah ${jam12} (${label})`
      }

      
    </script>
  </body>
</html>
