<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Ongkir</title>
</head>
<body>
        <label for="inputTotal">Total belanja</label>
        <input type="number" id="inputTotal" oninput="hitungOngkir()" placeholder="masukan total belanja">
        <div id="outputOngkir"></div>

    <script>
        function hitungOngkir(){
            const total = Number(document.getElementById("inputTotal").value);
            const ongkir = total >= 200000 ? "gratis ongkir"
                         : total >= 10000 ? "Ongkir Rp10.000"
                         : "ongkir Rp20.000";
            document.getElementById("outputOngkir").textContent = ongkir;
        }
    </script>
    
</body>
</html>
